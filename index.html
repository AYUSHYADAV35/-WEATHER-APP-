<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App | Week 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="weather-card">
      <h1>Weather App</h1>
      <p class="subtitle">Check current weather for any city</p>

      <div class="search-box">
        <input id="cityInput" type="text" placeholder="Enter city name" autocomplete="off">
        <button id="searchBtn">Search</button>
      </div>

      <p id="message" class="message">Enter a city to get the weather.</p>

      <div id="weatherResult" class="weather-result hidden">
        <h2 id="cityName">--</h2>
        <div class="temperature">
          <span id="temperature">--</span><span>°C</span>
        </div>
        <p id="condition">--</p>

        <div class="details">
          <div>
            <span class="label">Humidity</span>
            <strong id="humidity">--%</strong>
          </div>
          <div>
            <span class="label">Feels Like</span>
            <strong id="feelsLike">--°C</strong>
          </div>
        </div>
      </div>

      <p class="api-note">
        Powered by OpenWeather
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
